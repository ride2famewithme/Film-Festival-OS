name: FFOS Release CI

on:
  push:
    branches:
      - ci/ffos-release-candidate-22sep2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ffos_ci_only
          POSTGRES_DB: ffos_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffos_guard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Reject tracked secrets and local artifacts
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|[._-])|(^|/)_ \.env$|\.DS_Store$|Screen Shot|\.BAK|_PRE_|\.BACKUP_|dist_ffos_' || true)"
          if [ -n "$bad" ]; then
            echo "Tracked local/secret/backup artifacts are not allowed:"
            echo "$bad"
            exit 1
          fi

      - name: Check migration version uniqueness
        shell: bash
        run: |
          set -euo pipefail
          dupes="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print 2>/dev/null             | sed 's#.*/##'             | sed -nE 's/^([0-9]{14})_.*/\1/p'             | sort             | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "Duplicate executable migration versions:"
            echo "$dupes"
            exit 1
          fi

      - name: Jury assignment migration static regression checks
        run: node --test test/jury-assignment-guard.test.mjs

      - name: Isolated PostgreSQL jury assignment security tests
        env:
          PGPASSWORD: ffos_ci_only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: ffos_guard_test
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 -f test/sql/jury-assignment-guard-integration.sql

      - name: TypeScript release check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tsconfig.release.json ]; then
            npx tsc --noEmit -p tsconfig.release.json
          else
            npx tsc --noEmit -p tsconfig.app-check.json
          fi

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/functions/*/index.ts)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "STOP: No Edge Functions found"
            exit 1
          fi
          for file in "${files[@]}"; do
            deno check --no-lock --node-modules-dir=none "$file"
            echo "PASS: $file"
          done

      - name: Web production bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          EXPO_PUBLIC_ADAPTER: supabase
        run: npx expo export --platform web --output-dir dist_ci

      - name: Release gate summary
        run: |
          echo "FFOS Release CI passed."
          echo "TypeScript: PASS"
          echo "Supabase Edge Functions: PASS"
          echo "Web bundle: PASS"
          echo "Secret/artifact scan: PASS"
          echo "Migration filename sanity: PASS"
